[package]
name = "rclaude"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Remote-control client for the Claude Code terminal UI and bounded attachment broker"
readme = "README.md"
repository = "https://github.com/Typiqally/rclaude"
homepage = "https://github.com/Typiqally/rclaude"
documentation = "https://github.com/Typiqally/rclaude#readme"
keywords = ["claude", "anthropic", "remote-control", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = ["/src/**", "/tests/*.rs", "/tests/*.py", "/scripts/*.py", "/examples/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/RELEASING.md"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
